name: Build FFmpeg Decoder for ExoPlayer

on:
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [ main, master ]
    paths:
      - 'libraries/decoder_ffmpeg/**'  # 仅当FFmpeg模块变化时触发
  pull_request:
    branches: [ main, master ]

env:
  NDK_VERSION: "r26b"         # 测试过的NDK版本
  FFMPEG_VERSION: "release/6.0"  # 推荐的FFmpeg版本
  ANDROID_ABI: 21             # 匹配项目的minSdk
  ENABLED_DECODERS: "vorbis opus flac"  # 启用的解码器

jobs:
  build-ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 构建超时时间
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Cache NDK
      uses: actions/cache@v4  # 更新到v4版本
      id: cache-ndk
      with:
        path: android-ndk-${{ env.NDK_VERSION }}
        key: ndk-${{ env.NDK_VERSION }}

    - name: Cache FFmpeg
      uses: actions/cache@v4  # 更新到v4版本
      id: cache-ffmpeg
      with:
        path: ffmpeg
        key: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ hashFiles('**/build_ffmpeg.sh') }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4  # 更新到最新版本
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          nasm \
          pkg-config \
          autoconf \
          automake \
          libtool \
          cmake \
          ninja-build
    - name: Download NDK if not cached
      if: steps.cache-ndk.outputs.cache-hit != 'true'
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-${{ env.NDK_VERSION }}-linux.zip
        unzip -q android-ndk-${{ env.NDK_VERSION }}-linux.zip
        rm android-ndk-${{ env.NDK_VERSION }}-linux.zip
    - name: Clone FFmpeg if not cached
      if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch ${{ env.FFMPEG_VERSION }} \
          https://source.ffmpeg.org/git/ffmpeg.git ffmpeg
    - name: Setup environment
      run: |
        echo "NDK_PATH=$(pwd)/android-ndk-${{ env.NDK_VERSION }}" >> $GITHUB_ENV
        echo "FFMPEG_PATH=$(pwd)/ffmpeg" >> $GITHUB_ENV
        echo "FFMPEG_MODULE_PATH=$(pwd)/libraries/decoder_ffmpeg/src/main" >> $GITHUB_ENV
        echo "HOST_PLATFORM=linux-x86_64" >> $GITHUB_ENV
    - name: Create symbolic link
      run: |
        mkdir -p $FFMPEG_MODULE_PATH/jni
        ln -sf $FFMPEG_PATH $FFMPEG_MODULE_PATH/jni/ffmpeg
    - name: Build FFmpeg libraries
      run: |
        cd $FFMPEG_MODULE_PATH/jni
        chmod +x build_ffmpeg.sh
        ./build_ffmpeg.sh \
          "$FFMPEG_MODULE_PATH" \
          "$NDK_PATH" \
          "$HOST_PLATFORM" \
          "$ANDROID_ABI" \
          $ENABLED_DECODERS
        
        # 验证构建结果
        echo "Checking built libraries:"
        find "$FFMPEG_MODULE_PATH/jni" -name '*.so' | xargs -I {} sh -c 'echo "Built: {}" && file {}'
    - name: Build decoder_ffmpeg module
      run: |
        ls
        ./gradlew :libraries:decoder_ffmpeg:assembleRelease \
        -Pandroid.disableBuildConfig=true \
        --stacktrace \
        --info
   
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4  # 更新到v4版本
      with:
        name: ffmpeg-decoder-build
        path: |
          libraries/decoder_ffmpeg/build/outputs/aar/*.aar
          libraries/decoder_ffmpeg/build/reports/tests/**
          libraries/decoder_ffmpeg/build/intermediates/cmake/release/obj/**
    - name: Setup Android SDK for instrumentation tests
      if: github.event_name == 'workflow_dispatch'  # 仅在手动触发时运行耗时测试
      uses: android-actions/setup-android@v2

    - name: Run instrumentation tests
      if: github.event_name == 'workflow_dispatch'
      run: |
        ./gradlew :libraries:decoder_ffmpeg:connectedCheck
